<!DOCTYPE html>
<!-- psyconnect's Kit email template. Paste into Kit: Send → Email
     Templates → New template → HTML (code) editor, name it "PsyConnect".
     scripts/weekly_email.py picks a template with that name for the weekly
     broadcasts. Kit fills the message_content tag with each email's body
     and needs the unsubscribe_url and address tags in the footer. (Name no
     tag in this comment with its braces: Kit fills those in here too.) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>PsyConnect</title>
  <style>
    body { margin: 0; padding: 0; background: #f6efe4; }
    a { color: #6d4160; }
    @media (max-width: 600px) {
      .pc-pad { padding-left: 16px !important; padding-right: 16px !important; }
      /* the weekly email's two-up event cards stack full width */
      .pc-col { display: block !important; max-width: none !important; }
      .pc-gap { display: none !important; }
    }
    /* Dark mode: the site's dark palette, for mail apps that let the email
       choose (Apple Mail, Outlook on the web and the new Outlook, whose
       dark mode marks the page with data-ogsc / data-ogsb). The Gmail apps
       ignore all this and darken the email themselves; the cream-plated
       logo is for them. The pc-* classes come from scripts/weekly_email.py.
       Keep the three copies alike. */
    @media (prefers-color-scheme: dark) {
      .pc-page { background: #111714 !important; }
      .pc-card { background: #1d2420 !important; border-color: #2f3833 !important; }
      .pc-edge { border-color: #2f3833 !important; }
      .pc-ink { color: #ece7dc !important; }
      .pc-dim { color: #a9b3a9 !important; }
      .pc-plum { color: #93ccb4 !important; }
      .pc-ochre { color: #e9b48c !important; }
      .pc-cta { background: #93ccb4 !important; color: #0f1513 !important; }
      .pc-foot, .pc-foot a { color: #9aa89d !important; }
      .pc-logo-light { display: none !important; }
      .pc-logo-dark { display: block !important; }
    }
    [data-ogsb] .pc-page { background: #111714 !important; }
    [data-ogsb] .pc-card { background: #1d2420 !important; border-color: #2f3833 !important; }
    [data-ogsb] .pc-edge { border-color: #2f3833 !important; }
    [data-ogsb] .pc-cta { background: #93ccb4 !important; }
    [data-ogsc] .pc-ink { color: #ece7dc !important; }
    [data-ogsc] .pc-dim { color: #a9b3a9 !important; }
    [data-ogsc] .pc-plum { color: #93ccb4 !important; }
    [data-ogsc] .pc-ochre { color: #e9b48c !important; }
    [data-ogsc] .pc-cta { color: #0f1513 !important; }
    [data-ogsc] .pc-foot, [data-ogsc] .pc-foot a { color: #9aa89d !important; }
    [data-ogsc] .pc-logo-light { display: none !important; }
    [data-ogsc] .pc-logo-dark { display: block !important; }
  </style>
</head>
<body class="pc-page" style="margin:0;padding:0;background:#f6efe4;">
  <table class="pc-page" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f6efe4;">
    <tr>
      <td align="center" class="pc-pad" style="padding:28px 24px 8px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
          <tr>
            <td>
              {{ message_content }}
            </td>
          </tr>
          <tr>
            <td class="pc-foot pc-edge" style="border-top:1px solid #e6d8c3;padding:16px 0 0;font-size:12px;line-height:1.6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#7a6553;">
              You’re getting this because you signed up at
              <a href="https://psyconnect.london/" style="color:#7a6553;">psyconnect.london</a>.
              <a href="{{ unsubscribe_url }}" style="color:#7a6553;">Unsubscribe</a> in one click.<br>
              Made by your friendly <a href="https://www.digitalhandyman.london" style="color:#7a6553;">digital handyman</a>
              · <a href="https://psyconnect.london/about/" style="color:#7a6553;">About</a>
              · <a href="https://psyconnect.london/privacy/" style="color:#7a6553;">Privacy</a>
            </td>
          </tr>
          <!-- Kit's sending address, set well apart and labelled, so it
               doesn't read as PsyConnect's own -->
          <tr>
            <td class="pc-foot" style="padding:40px 0 28px;font-size:11px;line-height:1.6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#a08d7a;">
              Email sent using <a href="https://kit.com" style="color:#a08d7a;">kit.com</a> · {{ address }}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
