name: Daily scrape

on:
  schedule:
    # every 6 hours — Luma's feed gains events throughout the day
    - cron: "17 5,11,17,23 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write  # the source-health issue

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Scrape, enrich and upsert
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: londo scrape --store supabase --health-report scrape-health.md

      # A source that failed or came back short opens (or refreshes) one
      # issue, so a broken scraper doesn't just let its listings fade away.
      # Left open until closed by hand.
      - name: Report source health
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -s scrape-health.md ] || exit 0
          printf '\n[Latest run](%s)\n' "$RUN_URL" >> scrape-health.md
          title="Scraper health: sources failing or short"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue edit "$open" --body-file scrape-health.md
          else
            gh issue create --title "$title" --body-file scrape-health.md
          fi

      # Rebuild the static site (per-event SEO/OG pages) from fresh data
      - name: Build site
        run: python3 scripts/build_site.py build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # psyconnect: rebuilt from the fresh data and pushed to its own Pages repo
  deploy-psyconnect:
    needs: scrape
    runs-on: ubuntu-latest
    concurrency:
      group: psyconnect-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Build psyconnect
        run: python3 scripts/build_site.py --site psyconnect build-psyconnect
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PSYCONNECT_DEPLOY_KEY }}
          external_repository: adampluck/psyconnect
          publish_branch: gh-pages
          publish_dir: build-psyconnect
          force_orphan: true
          # keeps the custom-domain CNAME file across force-pushes
          cname: psyconnect.london
