name: Daily scrape

on:
  schedule:
    # twice a day. Each run's build downloads a year of rows from Supabase,
    # whose free plan caps what it sends out each month, so runs are rationed.
    # Wednesday's 10:00 UTC weekly email follows the 05:17 run.
    - cron: "17 5,17 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  issues: write  # the source-health issue

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Scrape, enrich and upsert
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: londo scrape --store supabase --health-report scrape-health.md

      # A source that failed or came back short opens (or refreshes) one
      # issue, so a broken scraper doesn't just let its listings fade away.
      # Left open until closed by hand.
      - name: Report source health
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -s scrape-health.md ] || exit 0
          printf '\n[Latest run](%s)\n' "$RUN_URL" >> scrape-health.md
          title="Scraper health: sources failing or short"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue edit "$open" --body-file scrape-health.md
          else
            gh issue create --title "$title" --body-file scrape-health.md
          fi

  # The londo site is no longer rebuilt or deployed (it had no traffic, and
  # its build doubled what each run downloads from Supabase). Its last
  # deploy stays up as it was.

  # psyconnect: rebuilt from the fresh data and pushed to its own Pages repo
  deploy-psyconnect:
    needs: scrape
    runs-on: ubuntu-latest
    concurrency:
      group: psyconnect-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      # what the live site lists now, for IndexNow's diff after deploy
      - name: Snapshot live sitemap
        run: python3 scripts/indexnow.py snapshot "$RUNNER_TEMP/live-sitemap.xml"
      - name: Build psyconnect
        run: python3 scripts/build_site.py --site psyconnect build-psyconnect
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PSYCONNECT_DEPLOY_KEY }}
          external_repository: adampluck/psyconnect
          publish_branch: gh-pages
          publish_dir: build-psyconnect
          force_orphan: true
          # keeps the custom-domain CNAME file across force-pushes
          cname: psyconnect.london
      # new and changed pages to Bing (and ChatGPT search, which reads
      # Bing): after Pages has had a minute to publish them
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          sleep 90
          python3 scripts/indexnow.py submit "$RUNNER_TEMP/live-sitemap.xml" build-psyconnect/sitemap.xml
