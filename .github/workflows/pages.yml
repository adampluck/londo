name: Deploy frontend

on:
  push:
    branches: [main]
    paths: ["web/**", "sites/**", "scripts/build_site.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # The londo site is no longer rebuilt or deployed (see scrape.yml).

  # psyconnect: same codebase, filtered dataset, pushed to its own Pages
  # repo (deploy key SSH — no GITHUB_TOKEN permissions involved)
  deploy-psyconnect:
    runs-on: ubuntu-latest
    concurrency:
      group: psyconnect-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      # what the live site lists now, for IndexNow's diff after deploy
      - name: Snapshot live sitemap
        run: python3 scripts/indexnow.py snapshot "$RUNNER_TEMP/live-sitemap.xml"
      - name: Build psyconnect
        run: python3 scripts/build_site.py --site psyconnect build-psyconnect
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PSYCONNECT_DEPLOY_KEY }}
          external_repository: adampluck/psyconnect
          publish_branch: gh-pages
          publish_dir: build-psyconnect
          force_orphan: true
          # keeps the custom-domain CNAME file across force-pushes
          cname: psyconnect.london
      # new and changed pages to Bing (and ChatGPT search, which reads
      # Bing): after Pages has had a minute to publish them
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          sleep 90
          python3 scripts/indexnow.py submit "$RUNNER_TEMP/live-sitemap.xml" build-psyconnect/sitemap.xml
