name: Weekly email

# Builds psyconnect's weekly email (one version per interest) and hands it
# to Kit the day before it goes out — Thursday 09:00 London, set in
# scripts/weekly_email.py. The gap leaves time to look over the drafts or
# cancel a scheduled send in Kit — and room for GitHub's scheduled runs,
# which can start hours late (18:00 runs on 4 and 11 Nov 2026 started
# 5–6 hours late). Mid-morning also follows the 05:17 scrape.
#
# Mode: the repo variable WEEKLY_EMAIL_MODE (Settings → Secrets and
# variables → Actions → Variables): "draft" (default — review and send
# from Kit) or "schedule" (sends itself). A manual run can override it.

on:
  # GitHub's scheduler starts runs hours late here (scrapes 7–9 h late in
  # Nov 2026) and sometimes drops them (11 and 18 Nov never ran), so try
  # three times. A re-run replaces the week's broadcasts, so the last one
  # to start wins, with the freshest data.
  schedule:
    - cron: "0 20 * * 2" # Tuesdays 20:00 UTC
    - cron: "0 2 * * 3" # Wednesdays 02:00 UTC
    - cron: "0 10 * * 3" # Wednesdays 10:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "preview (no Kit), draft or schedule"
        type: choice
        options: [preview, draft, schedule]
        default: preview
      send_at:
        description: "Send time, ISO, London if no offset (blank: next Thursday 09:00)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: weekly-email
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # stdlib only — no installs
      - name: Build and send to Kit
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          MODE: ${{ inputs.mode || vars.WEEKLY_EMAIL_MODE || 'draft' }}
          SEND_AT: ${{ inputs.send_at || '' }}
        run: |
          python3 scripts/weekly_email.py preview --out build-email ${SEND_AT:+--send-at "$SEND_AT"}
          if [ "$MODE" != "preview" ]; then
            python3 scripts/weekly_email.py "$MODE" ${SEND_AT:+--send-at "$SEND_AT"}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-email-preview
          path: build-email
          retention-days: 30
